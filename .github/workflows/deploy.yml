name: Deploy to GitHub Pages

on:
  # Deploy on every push to the default branch.
  push:
    branches: [main]
  # Allow manual deployments from the Actions tab.
  workflow_dispatch:

# Permissions required by GitHub Pages: read the repository, and let the
# workflow mint an OIDC token to publish the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at the same time; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show deployment target
        run: |
          echo "SITE_URL=${SITE_URL:-https://bcila.github.io (default)}"
          echo "BASE_PATH=${BASE_PATH:-/ (default)}"
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}

      - name: Install, build, and upload the site
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          # Optional. For a project site (https://<user>.github.io/<repo>/),
          # set these as repository variables:
          #   SITE_URL  = https://<user>.github.io
          #   BASE_PATH = /<repo>
          # astro.config.mjs falls back to this user site's defaults.
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
