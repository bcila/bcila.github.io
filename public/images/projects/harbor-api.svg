<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Abstract API service terminal illustration">
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#eef5f1" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="10%" r="70%">
      <stop offset="0" stop-color="#8ce8a8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8ce8a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="750" fill="#0a0c0d"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <text x="48" y="60" fill="#f1f4f2" font-family="Georgia, serif" font-size="26" letter-spacing="-0.5">Harbor API</text>
  <text x="48" y="82" fill="#6f7975" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.6">FASTAPI SERVICE TEMPLATE</text>

  <g font-family="ui-monospace, monospace" font-size="9">
    <rect x="810" y="44" width="130" height="30" rx="8" fill="#121617" stroke="#eef5f1" stroke-opacity="0.12"/>
    <text x="830" y="63" fill="#9aa39f">v1.4.0</text>
    <rect x="952" y="44" width="200" height="30" rx="8" fill="#8ce8a8" fill-opacity="0.1" stroke="#8ce8a8" stroke-opacity="0.25"/>
    <text x="972" y="63" fill="#8ce8a8">All checks passing</text>
  </g>

  <rect x="48" y="118" width="720" height="540" rx="14" fill="#0b0e0f" stroke="#eef5f1" stroke-opacity="0.14"/>
  <path d="M48 170h720" stroke="#eef5f1" stroke-opacity="0.1"/>
  <circle cx="78" cy="144" r="5" fill="#30393a"/>
  <circle cx="98" cy="144" r="5" fill="#30393a"/>
  <circle cx="118" cy="144" r="5" fill="#30393a"/>
  <text x="420" y="148" text-anchor="middle" fill="#6f7975" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">harbor · app/main.py</text>

  <g font-family="ui-monospace, monospace" font-size="12.5">
    <text x="76" y="206" fill="#59635f">1</text>
    <text x="112" y="206" fill="#8ce8a8">from</text>
    <text x="156" y="206" fill="#c8cfcb">fastapi</text>
    <text x="224" y="206" fill="#8ce8a8">import</text>
    <text x="278" y="206" fill="#c8cfcb">FastAPI</text>

    <text x="76" y="230" fill="#59635f">2</text>
    <text x="112" y="230" fill="#8ce8a8">from</text>
    <text x="156" y="230" fill="#c8cfcb">app.api</text>
    <text x="218" y="230" fill="#8ce8a8">import</text>
    <text x="272" y="230" fill="#c8cfcb">router</text>

    <text x="76" y="254" fill="#59635f">3</text>
    <text x="112" y="254" fill="#8ce8a8">from</text>
    <text x="156" y="254" fill="#c8cfcb">app.core.logging</text>
    <text x="294" y="254" fill="#8ce8a8">import</text>
    <text x="348" y="254" fill="#c8cfcb">configure_logging</text>

    <text x="76" y="290" fill="#59635f">5</text>
    <text x="112" y="290" fill="#c8cfcb">configure_logging()</text>

    <text x="76" y="314" fill="#59635f">6</text>
    <text x="112" y="314" fill="#c8cfcb">app =</text>
    <text x="166" y="314" fill="#8ce8a8">FastAPI</text>
    <text x="234" y="314" fill="#c8cfcb">(title=</text>
    <text x="292" y="314" fill="#a8d8b5">"Harbor API"</text>
    <text x="390" y="314" fill="#c8cfcb">)</text>

    <text x="76" y="338" fill="#59635f">7</text>
    <text x="112" y="338" fill="#c8cfcb">app.include_router(router, prefix=</text>
    <text x="372" y="338" fill="#a8d8b5">"/v1"</text>
    <text x="410" y="338" fill="#c8cfcb">)</text>

    <text x="76" y="374" fill="#59635f">9</text>
    <text x="112" y="374" fill="#6f7975"># health is intentionally dependency-free</text>

    <text x="76" y="398" fill="#59635f">10</text>
    <text x="112" y="398" fill="#8ce8a8">@app.get</text>
    <text x="190" y="398" fill="#c8cfcb">(</text>
    <text x="202" y="398" fill="#a8d8b5">"/healthz"</text>
    <text x="282" y="398" fill="#c8cfcb">)</text>

    <text x="76" y="422" fill="#59635f">11</text>
    <text x="112" y="422" fill="#8ce8a8">async def</text>
    <text x="190" y="422" fill="#c8cfcb">health():</text>

    <text x="76" y="446" fill="#59635f">12</text>
    <text x="132" y="446" fill="#8ce8a8">return</text>
    <text x="190" y="446" fill="#c8cfcb">{"status":</text>
    <text x="264" y="446" fill="#a8d8b5">"ok"</text>
    <text x="298" y="446" fill="#c8cfcb">}</text>

    <text x="76" y="482" fill="#59635f">14</text>
    <text x="112" y="482" fill="#6f7975"># run: uvicorn app.main:app --reload</text>
  </g>

  <rect x="112" y="510" width="624" height="128" rx="8" fill="#0e1112" stroke="#eef5f1" stroke-opacity="0.08"/>
  <g font-family="ui-monospace, monospace" font-size="10.5">
    <text x="130" y="534" fill="#59635f">$</text>
    <text x="146" y="534" fill="#c8cfcb">curl -s localhost:8000/healthz</text>
    <text x="130" y="560" fill="#8ce8a8">HTTP/1.1 200 OK</text>
    <text x="130" y="582" fill="#7d8783">content-type: application/json</text>
    <text x="130" y="604" fill="#7d8783">x-request-id: 7f3c…</text>
    <text x="130" y="626" fill="#c8cfcb">{"status":"ok","version":"1.4.0"}</text>
  </g>

  <g>
    <rect x="800" y="118" width="352" height="162" rx="12" fill="#0e1112" stroke="#eef5f1" stroke-opacity="0.12"/>
    <text x="824" y="146" fill="#c8cfcb" font-family="Georgia, serif" font-size="16">Batteries included</text>
    <g font-family="ui-monospace, monospace" font-size="9.5" fill="#7d8783">
      <circle cx="830" cy="174" r="2.5" fill="#8ce8a8"/>
      <text x="844" y="178">Pydantic settings</text>
      <circle cx="830" cy="198" r="2.5" fill="#8ce8a8"/>
      <text x="844" y="202">Alembic migrations</text>
      <circle cx="830" cy="222" r="2.5" fill="#8ce8a8"/>
      <text x="844" y="226">Structured JSON logs</text>
      <circle cx="830" cy="246" r="2.5" fill="#8ce8a8"/>
      <text x="844" y="250">Request ID middleware</text>
    </g>
  </g>

  <g>
    <rect x="800" y="296" width="352" height="150" rx="12" fill="#0e1112" stroke="#eef5f1" stroke-opacity="0.12"/>
    <text x="824" y="324" fill="#c8cfcb" font-family="Georgia, serif" font-size="16">Stack</text>
    <g font-family="ui-monospace, monospace" font-size="9" fill="#7d8783">
      <rect x="824" y="340" width="72" height="24" rx="12" fill="#121617" stroke="#eef5f1" stroke-opacity="0.1"/>
      <text x="840" y="356">FastAPI</text>
      <rect x="904" y="340" width="64" height="24" rx="12" fill="#121617" stroke="#eef5f1" stroke-opacity="0.1"/>
      <text x="920" y="356">Python</text>
      <rect x="976" y="340" width="106" height="24" rx="12" fill="#121617" stroke="#eef5f1" stroke-opacity="0.1"/>
      <text x="992" y="356">PostgreSQL</text>
      <rect x="824" y="372" width="64" height="24" rx="12" fill="#121617" stroke="#eef5f1" stroke-opacity="0.1"/>
      <text x="840" y="388">Docker</text>
      <rect x="896" y="372" width="112" height="24" rx="12" fill="#121617" stroke="#eef5f1" stroke-opacity="0.1"/>
      <text x="912" y="388">GitHub Actions</text>
      <rect x="824" y="404" width="62" height="24" rx="12" fill="#121617" stroke="#eef5f1" stroke-opacity="0.1"/>
      <text x="840" y="420">Alembic</text>
    </g>
  </g>

  <g>
    <rect x="800" y="462" width="352" height="196" rx="12" fill="#0e1112" stroke="#eef5f1" stroke-opacity="0.12"/>
    <text x="824" y="490" fill="#c8cfcb" font-family="Georgia, serif" font-size="16">Deploy</text>
    <g font-family="ui-monospace, monospace" font-size="9">
      <rect x="824" y="508" width="304" height="34" rx="7" fill="#0b0e0f" stroke="#eef5f1" stroke-opacity="0.08"/>
      <text x="840" y="529" fill="#8ce8a8">✓</text>
      <text x="858" y="529" fill="#9aa39f">tests · 42 passed</text>
      <rect x="824" y="550" width="304" height="34" rx="7" fill="#0b0e0f" stroke="#eef5f1" stroke-opacity="0.08"/>
      <text x="840" y="571" fill="#8ce8a8">✓</text>
      <text x="858" y="571" fill="#9aa39f">migrations · applied</text>
      <rect x="824" y="592" width="304" height="34" rx="7" fill="#8ce8a8" fill-opacity="0.06" stroke="#8ce8a8" stroke-opacity="0.2"/>
      <text x="840" y="613" fill="#8ce8a8">→</text>
      <text x="858" y="613" fill="#cfe9d8">deploy · production</text>
    </g>
  </g>

  <text x="1128" y="705" text-anchor="end" fill="#59635f" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.4">SAMPLE PROJECT · TEMPLATE ARTWORK</text>
</svg>
