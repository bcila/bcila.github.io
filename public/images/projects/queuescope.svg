<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Abstract task queue monitoring dashboard">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#eef5f1" stroke-opacity="0.04"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8ce8a8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#8ce8a8" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="#0a0c0d"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <text x="48" y="60" fill="#f1f4f2" font-family="Georgia, serif" font-size="26" letter-spacing="-0.5">QueueScope</text>
  <text x="48" y="82" fill="#6f7975" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.6">CELERY · REDIS · WORKERS</text>

  <g font-family="ui-monospace, monospace" font-size="9">
    <rect x="848" y="44" width="94" height="30" rx="8" fill="#121617" stroke="#eef5f1" stroke-opacity="0.12"/>
    <text x="866" y="63" fill="#9aa39f">Last 24h</text>
    <circle cx="972" cy="59" r="4" fill="#8ce8a8"/>
    <text x="984" y="63" fill="#9aa39f" letter-spacing="1">HEALTHY</text>
  </g>

  <g>
    <rect x="48" y="112" width="256" height="112" rx="10" fill="#0e1112" stroke="#eef5f1" stroke-opacity="0.1"/>
    <rect x="320" y="112" width="256" height="112" rx="10" fill="#0e1112" stroke="#eef5f1" stroke-opacity="0.1"/>
    <rect x="592" y="112" width="256" height="112" rx="10" fill="#0e1112" stroke="#eef5f1" stroke-opacity="0.1"/>
    <rect x="864" y="112" width="288" height="112" rx="10" fill="#0e1112" stroke="#eef5f1" stroke-opacity="0.1"/>
    <g font-family="ui-monospace, monospace" font-size="9" fill="#6f7975" letter-spacing="1.1">
      <text x="68" y="138">QUEUE DEPTH</text>
      <text x="340" y="138">IN FLIGHT</text>
      <text x="612" y="138">RETRY RATE</text>
      <text x="884" y="138">OLDEST MESSAGE</text>
    </g>
    <g font-family="ui-monospace, monospace">
      <text x="68" y="184" fill="#f1f4f2" font-size="30">1,248</text>
      <text x="340" y="184" fill="#f1f4f2" font-size="30">96</text>
      <text x="612" y="184" fill="#f1f4f2" font-size="30">2.4%</text>
      <text x="884" y="184" fill="#f1f4f2" font-size="30">42<span fill="#6f7975" font-size="13"> s</span></text>
    </g>
    <g font-family="ui-monospace, monospace" font-size="8.5" fill="#8ce8a8">
      <text x="68" y="206">+12% vs. yesterday</text>
      <text x="340" y="206">8 workers</text>
      <text x="612" y="206">within threshold</text>
      <text x="884" y="206">warning at 60s</text>
    </g>
  </g>

  <rect x="48" y="250" width="616" height="232" rx="10" fill="#0e1112" stroke="#eef5f1" stroke-opacity="0.1"/>
  <text x="72" y="278" fill="#c8cfcb" font-family="Georgia, serif" font-size="16">Throughput</text>
  <text x="72" y="298" fill="#6f7975" font-family="ui-monospace, monospace" font-size="8.5" letter-spacing="1.1">TASKS / MINUTE</text>
  <g stroke="#eef5f1" stroke-opacity="0.05">
    <path d="M72 330h568M72 370h568M72 410h568M72 450h568"/>
  </g>

  <g fill="url(#bar)">
    <rect x="76" y="396" width="18" height="54" rx="3"/>
    <rect x="106" y="380" width="18" height="70" rx="3"/>
    <rect x="136" y="404" width="18" height="46" rx="3"/>
    <rect x="166" y="360" width="18" height="90" rx="3"/>
    <rect x="196" y="344" width="18" height="106" rx="3"/>
    <rect x="226" y="368" width="18" height="82" rx="3"/>
    <rect x="256" y="326" width="18" height="124" rx="3"/>
    <rect x="286" y="352" width="18" height="98" rx="3"/>
    <rect x="316" y="314" width="18" height="136" rx="3"/>
    <rect x="346" y="338" width="18" height="112" rx="3"/>
    <rect x="376" y="300" width="18" height="150" rx="3"/>
    <rect x="406" y="322" width="18" height="128" rx="3"/>
    <rect x="436" y="290" width="18" height="160" rx="3"/>
    <rect x="466" y="308" width="18" height="142" rx="3"/>
    <rect x="496" y="276" width="18" height="174" rx="3"/>
    <rect x="526" y="296" width="18" height="154" rx="3"/>
    <rect x="556" y="330" width="18" height="120" rx="3"/>
    <rect x="586" y="348" width="18" height="102" rx="3"/>
    <rect x="616" y="372" width="18" height="78" rx="3"/>
  </g>

  <rect x="680" y="250" width="472" height="232" rx="10" fill="#0e1112" stroke="#eef5f1" stroke-opacity="0.1"/>
  <text x="704" y="278" fill="#c8cfcb" font-family="Georgia, serif" font-size="16">Queues</text>
  <text x="704" y="298" fill="#6f7975" font-family="ui-monospace, monospace" font-size="8.5" letter-spacing="1.1">DEPTH BY ROUTING KEY</text>
  <g font-family="ui-monospace, monospace" font-size="9">
    <text x="704" y="332" fill="#c8cfcb">critical</text>
    <rect x="800" y="322" width="300" height="8" rx="4" fill="#1a2021"/>
    <rect x="800" y="322" width="92" height="8" rx="4" fill="#8ce8a8"/>
    <text x="1116" y="332" text-anchor="end" fill="#6f7975">142</text>

    <text x="704" y="364" fill="#c8cfcb">default</text>
    <rect x="800" y="354" width="300" height="8" rx="4" fill="#1a2021"/>
    <rect x="800" y="354" width="186" height="8" rx="4" fill="#8ce8a8"/>
    <text x="1116" y="364" text-anchor="end" fill="#6f7975">524</text>

    <text x="704" y="396" fill="#c8cfcb">bulk</text>
    <rect x="800" y="386" width="300" height="8" rx="4" fill="#1a2021"/>
    <rect x="800" y="386" width="248" height="8" rx="4" fill="#8ce8a8"/>
    <text x="1116" y="396" text-anchor="end" fill="#6f7975">498</text>

    <text x="704" y="428" fill="#c8cfcb">batch</text>
    <rect x="800" y="418" width="300" height="8" rx="4" fill="#1a2021"/>
    <rect x="800" y="418" width="54" height="8" rx="4" fill="#e8c98c"/>
    <text x="1116" y="428" text-anchor="end" fill="#6f7975">84</text>
  </g>
  <text x="704" y="462" fill="#6f7975" font-family="ui-monospace, monospace" font-size="8.5">4 queues · 8 workers · 1 scheduled task</text>

  <rect x="48" y="502" width="1104" height="170" rx="10" fill="#0e1112" stroke="#eef5f1" stroke-opacity="0.1"/>
  <text x="72" y="530" fill="#c8cfcb" font-family="Georgia, serif" font-size="16">Slowest task paths</text>
  <g font-family="ui-monospace, monospace" font-size="9" fill="#7d8783">
    <path d="M72 550h1056" stroke="#eef5f1" stroke-opacity="0.07"/>
    <text x="72" y="576">app.tasks.rebuild_search_index</text>
    <text x="530" y="576">bulk</text>
    <text x="700" y="576">18.4 s</text>
    <rect x="800" y="568" width="300" height="6" rx="3" fill="#1a2021"/>
    <rect x="800" y="568" width="256" height="6" rx="3" fill="#e8c98c"/>
    <text x="1128" y="576" text-anchor="end">retry 1/5</text>

    <path d="M72 590h1056" stroke="#eef5f1" stroke-opacity="0.07"/>
    <text x="72" y="616">app.tasks.send_receipt</text>
    <text x="530" y="616">critical</text>
    <text x="700" y="616">1.2 s</text>
    <rect x="800" y="608" width="300" height="6" rx="3" fill="#1a2021"/>
    <rect x="800" y="608" width="48" height="6" rx="3" fill="#8ce8a8"/>
    <text x="1128" y="616" text-anchor="end">ok</text>

    <path d="M72 630h1056" stroke="#eef5f1" stroke-opacity="0.07"/>
    <text x="72" y="656">app.tasks.refresh_report</text>
    <text x="530" y="656">batch</text>
    <text x="700" y="656">7.8 s</text>
    <rect x="800" y="648" width="300" height="6" rx="3" fill="#1a2021"/>
    <rect x="800" y="648" width="132" height="6" rx="3" fill="#8ce8a8"/>
    <text x="1128" y="656" text-anchor="end">ok</text>
  </g>

  <text x="1128" y="710" text-anchor="end" fill="#59635f" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.4">SAMPLE PROJECT · TEMPLATE ARTWORK</text>
</svg>
